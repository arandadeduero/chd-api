# Copia este archivo a docker-compose.yml y ajusta lo que necesites:
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d

services:
  chd-api:
    image: ghcr.io/arandadeduero/chd-api:latest
    container_name: chd-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
